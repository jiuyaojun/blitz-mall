<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家后台 — Blitz 智能商城</title>
<link rel="stylesheet" href="/css/common.css">
<style>
  .merchant-layout { display: flex; min-height: calc(100vh - 200px); gap: 0; }
  .merchant-sidebar {
    width: 220px; min-width: 220px;
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 16px 0;
  }
  .sidebar-title { padding: 8px 20px 16px; font-weight: 700; color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .sidebar-link {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; cursor: pointer; transition: all 0.15s;
    font-size: 0.9rem; color: var(--text); border-left: 3px solid transparent;
  }
  .sidebar-link:hover { background: var(--primary-bg); }
  .sidebar-link.active { background: var(--primary-bg); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
  .sidebar-link .icon { font-size: 1.1rem; width: 22px; text-align: center; }
  .merchant-main { flex: 1; padding: 24px; overflow-x: auto; }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 20px;
  }
  .stat-card .stat-label { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
  .stat-card .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
  .section-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-header-row h3 { margin: 0; }
  .product-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
  .product-table th, .product-table td { padding: 10px 14px; text-align: left; font-size: 0.88rem; border-bottom: 1px solid var(--border); }
  .product-table th { background: var(--bg); font-weight: 600; color: var(--text-secondary); font-size: 0.8rem; }
  .product-table tr:hover td { background: var(--primary-bg); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .badge-on { background: #d4edda; color: #155724; }
  .badge-off { background: #f8d7da; color: #721c24; }
  .action-btn { background: none; border: 1px solid var(--border); padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.8rem; margin-right: 4px; transition: all 0.15s; }
  .action-btn:hover { border-color: var(--primary); color: var(--primary); }
  .action-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); padding: 28px; width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal h4 { margin-top: 0; }
  .modal .form-group { margin-bottom: 14px; }
  .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
  .sku-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .sku-row input { flex: 1; min-width: 80px; }
  .empty-shop { text-align: center; padding: 60px 20px; }
  .empty-shop .empty-icon { font-size: 4rem; }
  .empty-shop h3 { margin: 12px 0 6px; }
  .hidden { display: none !important; }

  @media (max-width: 768px) {
    .merchant-layout { flex-direction: column; }
    .merchant-sidebar {
      width: 100%; min-width: 0;
      display: flex; overflow-x: auto; padding: 8px;
      border-right: none; border-bottom: 1px solid var(--border);
    }
    .sidebar-title { display: none; }
    .sidebar-link { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 0.82rem; }
    .sidebar-link.active { border-left: none; border-bottom-color: var(--primary); }
    .merchant-main { padding: 16px; }
    .stat-cards { grid-template-columns: repeat(2, 1fr); }
    .product-table { font-size: 0.78rem; }
    .product-table th:nth-child(4), .product-table td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<nav class="blitz-navbar" id="blitz-navbar"></nav>
<div id="toast-container" class="toast-container"></div>

<div class="merchant-layout">
  <aside class="merchant-sidebar" id="sidebar">
    <div class="sidebar-title">商家中心</div>
    <div class="sidebar-link active" data-view="dashboard"><span class="icon">📊</span> 数据概览</div>
    <div class="sidebar-link" data-view="products"><span class="icon">📦</span> 商品管理</div>
    <div class="sidebar-link" data-view="shop"><span class="icon">🏪</span> 店铺设置</div>
  </aside>

  <main class="merchant-main">
    <!-- Dashboard -->
    <div id="view-dashboard">
      <div class="stat-cards" id="statCards"></div>
      <div class="section-header-row"><h3>最近商品</h3></div>
      <div id="recentProducts"></div>
    </div>

    <!-- Products -->
    <div id="view-products" class="hidden">
      <div class="section-header-row">
        <h3>商品列表</h3>
        <button class="btn btn-primary" onclick="showProductModal()">+ 添加商品</button>
      </div>
      <div id="productList"></div>
    </div>

    <!-- Shop Settings -->
    <div id="view-shop" class="hidden">
      <h3>店铺设置</h3>
      <div class="form-card" id="shopForm" style="max-width:500px"></div>
    </div>
  </main>
</div>

<!-- Product Modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <h4 id="productModalTitle">添加商品</h4>
    <div class="form-group"><label class="form-label">商品名称 *</label><input class="form-input" id="prodName" placeholder="请输入商品名称"></div>
    <div class="form-group"><label class="form-label">品牌</label><input class="form-input" id="prodBrand" placeholder="品牌名称"></div>
    <div class="form-group"><label class="form-label">描述</label><textarea class="form-input" id="prodDesc" rows="2" placeholder="商品描述"></textarea></div>
    <div class="form-group"><label class="form-label">主图URL</label><input class="form-input" id="prodImage" placeholder="https://..."></div>
    <div class="form-group"><label class="form-label">分类ID</label><input class="form-input" id="prodCatId" type="number" value="1"></div>
    <div class="form-group">
      <label class="form-label">SKU 规格</label>
      <div id="skuList"></div>
      <button class="btn btn-sm btn-outline" onclick="addSkuRow()" style="margin-top:6px">+ 添加规格</button>
    </div>
    <input type="hidden" id="editProductId" value="">
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeProductModal()">取消</button>
      <button class="btn btn-primary" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<footer class="blitz-footer"><p>⚡ Blitz 智能商城 &copy; 2026 · 商家中心</p></footer>

<script src="/js/common.js"></script>
<script src="/js/api.js"></script>
<script>
(function() {
  'use strict';
  var state = { view: 'dashboard', shop: null, products: [] };

  document.addEventListener('DOMContentLoaded', function() {
    if (!AUTH.isLoggedIn()) { location.href = '/login.html?redirect=/merchant.html'; return; }
    var u = AUTH.getUser();
    if (u.roleId !== 3 && u.roleId !== 1) { showToast('仅商家可访问此页面', 'error'); setTimeout(function(){location.href='/'}, 2000); return; }
    renderNavbar('merchant');
    initMobileNav('merchant');
    loadDashboard();
    bindSidebar();
  });

  function bindSidebar() {
    document.getElementById('sidebar').addEventListener('click', function(e) {
      var link = e.target.closest('.sidebar-link');
      if (!link) return;
      document.querySelectorAll('.sidebar-link').forEach(function(l) { l.classList.remove('active'); });
      link.classList.add('active');
      state.view = link.getAttribute('data-view');
      document.querySelectorAll('[id^="view-"]').forEach(function(v) { v.classList.add('hidden'); });
      document.getElementById('view-' + state.view).classList.remove('hidden');
      if (state.view === 'dashboard') loadDashboard();
      if (state.view === 'products') loadProducts();
      if (state.view === 'shop') loadShopSettings();
    });
  }

  /* ==================== Dashboard ==================== */
  async function loadDashboard() {
    try {
      var r = await api.get('/merchant/dashboard');
      if (r.code !== 0) { showShopRequired(); return; }
      var d = r.data;
      document.getElementById('statCards').innerHTML =
        '<div class="stat-card"><div class="stat-label">店铺名称</div><div class="stat-value" style="font-size:1.3rem">' + (d.shopName || '-') + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">商品总数</div><div class="stat-value">' + (d.productCount || 0) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">在售商品</div><div class="stat-value">' + (d.onSaleCount || 0) + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">累计销量</div><div class="stat-value">' + (d.totalSales || 0) + '</div></div>';
    } catch(e) { showShopRequired(); }
  }

  function showShopRequired() {
    document.getElementById('statCards').innerHTML = '';
    document.getElementById('recentProducts').innerHTML =
      '<div class="empty-shop"><div class="empty-icon">🏪</div><h3>您还没有店铺</h3><p>创建一个店铺开始销售商品</p><button class="btn btn-primary mt-16" onclick="quickCreateShop()">创建店铺</button></div>';
  }

  /* ==================== Products ==================== */
  async function loadProducts() {
    try {
      var r = await api.get('/merchant/products');
      state.products = r.data || [];
      renderProductTable();
    } catch(e) { document.getElementById('productList').innerHTML = '<p style="color:var(--text-muted)">加载失败：' + e.message + '</p>'; }
  }

  function renderProductTable() {
    var el = document.getElementById('productList');
    if (state.products.length === 0) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><h3>暂无商品</h3><p>点击右上角按钮添加第一个商品</p></div>'; return; }
    var html = '<table class="product-table"><thead><tr><th>商品名称</th><th>价格</th><th>销量</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    state.products.forEach(function(p) {
      var price = p.minPrice != null ? formatPrice(p.minPrice) : '-';
      var statusBadge = p.status === 1 ? '<span class="badge badge-on">在售</span>' : '<span class="badge badge-off">下架</span>';
      html += '<tr><td><strong>' + p.name + '</strong></td><td>' + price + '</td><td>' + (p.sales || 0) + '</td><td>' + statusBadge + '</td>' +
        '<td>' +
          '<button class="action-btn" onclick="editProduct(' + p.id + ')">编辑</button>' +
          '<button class="action-btn" onclick="toggleProduct(' + p.id + ')">' + (p.status === 1 ? '下架' : '上架') + '</button>' +
          '<button class="action-btn danger" onclick="deleteProduct(' + p.id + ')">删除</button>' +
        '</td></tr>';
    });
    html += '</tbody></table>';
    el.innerHTML = html;
  }

  window.editProduct = function(id) {
    var p = state.products.find(function(x) { return x.id === id; });
    if (!p) return;
    document.getElementById('productModalTitle').textContent = '编辑商品';
    document.getElementById('editProductId').value = id;
    document.getElementById('prodName').value = p.name || '';
    document.getElementById('prodBrand').value = p.brand || '';
    document.getElementById('prodDesc').value = p.description || '';
    document.getElementById('prodImage').value = p.image || '';
    document.getElementById('prodCatId').value = p.categoryId || 1;
    document.getElementById('skuList').innerHTML = '';
    if (p.skus && p.skus.length > 0) {
      p.skus.forEach(function(s) { addSkuRow(s.name, s.price, s.stock); });
    } else { addSkuRow(); }
    document.getElementById('productModal').classList.add('active');
  };

  window.toggleProduct = async function(id) {
    try { await api.post('/merchant/products/' + id + '/toggle'); showToast('操作成功', 'success'); loadProducts(); }
    catch(e) { showToast('操作失败：' + e.message, 'error'); }
  };

  window.deleteProduct = async function(id) {
    if (!confirm('确定删除该商品？此操作不可恢复。')) return;
    try { await api.del('/merchant/products/' + id); showToast('已删除', 'success'); loadProducts(); }
    catch(e) { showToast('删除失败：' + e.message, 'error'); }
  };

  window.showProductModal = function() {
    document.getElementById('productModalTitle').textContent = '添加商品';
    document.getElementById('editProductId').value = '';
    document.getElementById('prodName').value = '';
    document.getElementById('prodBrand').value = '';
    document.getElementById('prodDesc').value = '';
    document.getElementById('prodImage').value = '';
    document.getElementById('prodCatId').value = '1';
    document.getElementById('skuList').innerHTML = '';
    addSkuRow();
    document.getElementById('productModal').classList.add('active');
  };

  window.closeProductModal = function() { document.getElementById('productModal').classList.remove('active'); };

  window.addSkuRow = function(name, price, stock) {
    var div = document.createElement('div'); div.className = 'sku-row';
    div.innerHTML = '<input class="form-input" placeholder="规格名" value="' + (name || '') + '" style="flex:2">' +
      '<input class="form-input" placeholder="价格" type="number" step="0.01" value="' + (price != null ? price : '') + '" style="flex:1">' +
      '<input class="form-input" placeholder="库存" type="number" value="' + (stock != null ? stock : '0') + '" style="flex:1">' +
      '<button class="action-btn danger" onclick="this.parentElement.remove()">×</button>';
    document.getElementById('skuList').appendChild(div);
  };

  window.saveProduct = async function() {
    var id = document.getElementById('editProductId').value;
    var name = document.getElementById('prodName').value.trim();
    if (!name) { showToast('请输入商品名称', 'warning'); return; }
    var skuRows = document.querySelectorAll('#skuList .sku-row');
    var skus = [];
    skuRows.forEach(function(row) {
      var inputs = row.querySelectorAll('input');
      var sn = inputs[0].value.trim();
      if (sn) skus.push({ name: sn, price: parseFloat(inputs[1].value) || 0, stock: parseInt(inputs[2].value) || 0, spec: {} });
    });
    var body = { name: name, brand: document.getElementById('prodBrand').value.trim(),
      description: document.getElementById('prodDesc').value.trim(),
      mainImage: document.getElementById('prodImage').value.trim(),
      categoryId: parseInt(document.getElementById('prodCatId').value) || 1,
      skus: skus };
    try {
      if (id) { await api.put('/merchant/products/' + id, body); } else { await api.post('/merchant/products', body); }
      closeProductModal(); showToast(id ? '已更新' : '已创建', 'success'); loadProducts();
    } catch(e) { showToast('保存失败：' + e.message, 'error'); }
  };

  /* ==================== Shop Settings ==================== */
  async function loadShopSettings() {
    try {
      var r = await api.get('/merchant/shop');
      state.shop = r.data;
      document.getElementById('shopForm').innerHTML =
        '<div class="form-group"><label class="form-label">店铺名称</label><input class="form-input" id="shopName" value="' + (state.shop.name || '') + '"></div>' +
        '<div class="form-group"><label class="form-label">店铺描述</label><textarea class="form-input" id="shopDesc" rows="3">' + (state.shop.description || '') + '</textarea></div>' +
        '<div class="form-group"><label class="form-label">店铺Logo URL</label><input class="form-input" id="shopLogo" value="' + (state.shop.logo || '') + '"></div>' +
        '<button class="btn btn-primary" onclick="saveShop()">保存设置</button>';
    } catch(e) {
      document.getElementById('shopForm').innerHTML =
        '<div class="empty-shop"><div class="empty-icon">🏪</div><h3>尚未创建店铺</h3><p>创建店铺后即可管理商品</p>' +
        '<div class="form-group"><input class="form-input" id="newShopName" placeholder="店铺名称" style="max-width:300px;margin:0 auto"></div>' +
        '<button class="btn btn-primary mt-16" onclick="createShop()">创建店铺</button></div>';
    }
  }

  window.saveShop = async function() {
    try {
      await api.put('/merchant/shop', { name: document.getElementById('shopName').value, description: document.getElementById('shopDesc').value, logo: document.getElementById('shopLogo').value });
      showToast('已保存', 'success');
    } catch(e) { showToast('保存失败：' + e.message, 'error'); }
  };

  window.createShop = async function() {
    var name = document.getElementById('newShopName').value.trim() || '我的店铺';
    try { await api.post('/merchant/shop', { name: name }); showToast('店铺创建成功！', 'success'); loadShopSettings(); } catch(e) { showToast('创建失败：' + e.message, 'error'); }
  };

  window.quickCreateShop = async function() {
    try { await api.post('/merchant/shop', { name: '我的店铺', description: '欢迎光临！' }); showToast('店铺创建成功！', 'success'); loadDashboard(); } catch(e) { showToast('创建失败：' + e.message, 'error'); }
  };

  /* ==================== Modal close on overlay click ==================== */
  document.addEventListener('click', function(e) { if (e.target.id === 'productModal') closeProductModal(); });
})();
</script>
</body>
</html>
