# ============================================================
# Blitz Production Profile
# 启动方式: SPRING_PROFILES_ACTIVE=prod,ai
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-response-header-size: 8KB
    max-swallow-size: 2MB

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blitz?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      filter:
        stat:
          enabled: true
        wall:
          enabled: true
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: blitz
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

blitz:
  jwt:
    secret: ${BLITZ_JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  seckill:
    path-secret: ${BLITZ_SECKILL_PATH_SECRET}

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.blitz: info
    org.springframework.security: warn
