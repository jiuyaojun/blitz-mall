# ============================================================
# Blitz AI Module Configuration
# PostgreSQL + pgvector + Spring AI OpenAI
# ============================================================

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      chat:
        options:
          model: glm-4-flash
          temperature: 0.7
      embedding:
        options:
          model: embedding-2

# PostgreSQL DataSource for pgvector (separate from MySQL primary)
blitz:
  pg:
    datasource:
      jdbc-url: jdbc:postgresql://localhost:5432/blitz_ai
      username: ${PG_USER:blitz}
      password: ${PG_PASSWORD}
      driver-class-name: org.postgresql.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
