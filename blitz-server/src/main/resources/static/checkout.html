<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认订单 — Blitz 智能商城</title>
<link rel="stylesheet" href="/css/common.css">
<style>
  /* Checkout Progress Bar */
  :root {
    --primary-gradient: linear-gradient(135deg, #E85D2C, #D04A1A);
    --radius-xs: 2px;
  }
  .checkout-progress {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px; padding: 16px 0;
  }
  .progress-step {
    display: flex; align-items: center; gap: 8px;
  }
  .progress-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: #e5e7eb; color: #9ca3af;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
    transition: all 0.3s;
  }
  .progress-step.active .progress-dot {
    background: var(--primary-gradient); color: #fff;
  }
  .progress-label {
    font-size: 0.85rem; color: #9ca3af; font-weight: 500;
  }
  .progress-step.active .progress-label {
    color: var(--primary); font-weight: 700;
  }
  .progress-line {
    width: 60px; height: 2px; background: #e5e7eb;
    margin: 0 12px; flex-shrink: 0;
  }

  .checkout-layout {
    display: flex; gap: 20px; align-items: flex-start;
  }
  .checkout-main {
    flex: 1; min-width: 0;
  }
  .checkout-sidebar {
    width: 340px; flex-shrink: 0;
    position: sticky; top: calc(var(--navbar-height) + 20px);
  }
  .checkout-section h3 {
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border-light);
  }
  .checkout-section h3 .step-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary-gradient); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
  }
  .address-card .addr-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .address-card .addr-tag {
    display: inline-block; padding: 1px 8px; border-radius: var(--radius-xs);
    background: var(--primary-bg); color: var(--primary);
    font-size: 0.7rem; font-weight: 600;
  }
  .address-card .addr-actions {
    display: flex; gap: 4px;
  }
  .address-card .addr-actions button {
    font-size: 0.72rem; color: var(--text-muted); cursor: pointer;
    padding: 2px 6px; border-radius: var(--radius-xs);
  }
  .address-card .addr-actions button:hover { color: var(--primary); background: var(--primary-bg); }
  .checkout-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--border-light);
  }
  .checkout-item:last-child { border-bottom: none; }
  .checkout-item .ci-img {
    width: 72px; height: 72px; border-radius: var(--radius-sm);
    overflow: hidden; flex-shrink: 0;
    background: #FAFAFA; display: flex; align-items: center; justify-content: center;
  }
  .checkout-item .ci-img img { width: 100%; height: 100%; object-fit: cover; }
  .checkout-item .ci-img .img-placeholder { font-size: 2rem; color: var(--text-muted); opacity: 0.3; }
  .checkout-item .ci-info { flex: 1; min-width: 0; }
  .checkout-item .ci-name {
    font-weight: 500; font-size: 0.9rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 4px;
  }
  .checkout-item .ci-sku { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; }
  .checkout-item .ci-price-qty { display: flex; align-items: center; gap: 12px; }
  .checkout-item .ci-price { font-weight: 700; color: var(--accent); }
  .checkout-item .ci-qty { font-size: 0.8rem; color: var(--text-muted); }
  .checkout-item .ci-subtotal { font-weight: 700; color: var(--accent); font-size: 0.95rem; min-width: 70px; text-align: right; flex-shrink: 0; }
  .price-summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 0.9rem;
  }
  .price-summary-row .label { color: var(--text-secondary); }
  .price-summary-row .value { font-weight: 600; }
  .price-summary-row.free .value { color: var(--success); }
  .price-summary-divider { border-top: 1px dashed var(--border); margin: 4px 0; }
  .price-summary-total { padding-top: 12px; }
  .price-summary-total .label { font-weight: 700; font-size: 0.95rem; }
  .price-summary-total .value { font-size: 1.4rem; font-weight: 900; color: var(--accent); }
  .submit-btn-wrap { margin-top: 16px; }
  .submit-btn-wrap .btn { min-height: 48px; font-size: 1rem; }
  .delivery-estimate {
    margin-top: 12px; text-align: center;
    font-size: 0.8rem; color: var(--text-secondary);
  }
  .btn-loading { pointer-events: none; }
  .btn-loading::after {
    content: ''; display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.6s linear infinite;
    margin-left: 8px;
  }
  @media (max-width: 768px) {
    .checkout-layout { flex-direction: column; }
    .checkout-sidebar { width: 100%; position: static; }
    .checkout-item { flex-wrap: wrap; }
    .checkout-item .ci-img { width: 60px; height: 60px; }
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="blitz-navbar" id="blitz-navbar"></nav>

<main class="main-content">

  <!-- Checkout Progress Bar -->
  <div class="checkout-progress">
    <div class="progress-step active">
      <span class="progress-dot">1</span>
      <span class="progress-label">收货地址</span>
    </div>
    <div class="progress-line"></div>
    <div class="progress-step">
      <span class="progress-dot">2</span>
      <span class="progress-label">确认订单</span>
    </div>
    <div class="progress-line"></div>
    <div class="progress-step">
      <span class="progress-dot">3</span>
      <span class="progress-label">支付</span>
    </div>
  </div>

  <div class="checkout-layout">

    <!-- LEFT: Main content -->
    <div class="checkout-main">

      <!-- Section 1: Shipping Address -->
      <div class="checkout-section" id="sectionAddress">
        <h3><span class="step-num">1</span>收货地址</h3>
        <div id="addressList">
          <div class="spinner"></div>
        </div>
        <div class="mt-12">
          <button class="btn btn-outline btn-sm" id="btnAddAddress">+ 新增地址</button>
        </div>
      </div>

      <!-- Section 2: Order Items -->
      <div class="checkout-section" id="sectionItems">
        <h3><span class="step-num">2</span>订单商品</h3>
        <div id="orderItems"></div>
      </div>

    </div>

    <!-- RIGHT: Price Summary Sidebar -->
    <div class="checkout-sidebar">
      <div class="checkout-section" id="sectionSummary">
        <h3>价格明细</h3>
        <div class="price-summary-row">
          <span class="label">商品总额</span>
          <span class="value" id="sumSubtotal">-</span>
        </div>
        <div class="price-summary-row free">
          <span class="label">运费</span>
          <span class="value">免运费</span>
        </div>
        <div class="price-summary-divider"></div>
        <div class="price-summary-row" id="couponDiscountRow" style="display:none;color:var(--danger)">
          <span class="label">优惠券抵扣</span>
          <span class="value" id="couponDiscount">-¥0.00</span>
        </div>
        <div class="price-summary-row price-summary-total">
          <span class="label">订单合计</span>
          <span class="value" id="sumTotal">-</span>
        </div>

        <!-- Coupon Selection -->
        <div class="checkout-section" style="margin-top:12px">
          <h3>🎫 优惠券 <span style="font-weight:400;font-size:13px;color:var(--text-muted)" id="couponHint">（选择可用优惠券）</span></h3>
          <select id="couponSelect" class="form-input" style="max-width:100%" onchange="onCouponChange()">
            <option value="">不使用优惠券</option>
          </select>
        </div>

        <div class="submit-btn-wrap">
          <button class="btn btn-primary btn-block btn-xl" id="btnSubmit">提交订单</button>
          <p class="delivery-estimate">📦 预计送达时间：下单后 <strong>2-4 个工作日</strong></p>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="blitz-footer">
  <p>&copy; 2026 Blitz 智能商城 · 品质生活，触手可及</p>
</footer>

<!-- Address Modal -->
<div class="modal-overlay" id="addressModal">
  <div class="modal">
    <h4 id="addressModalTitle">新增收货地址</h4>
    <form id="addressForm" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="addrName">收货人<span class="required">*</span></label>
        <input class="form-input" id="addrName" type="text" placeholder="请输入收货人姓名" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="addrPhone">手机号码<span class="required">*</span></label>
        <input class="form-input" id="addrPhone" type="text" placeholder="请输入手机号码" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="addrProvince">省份<span class="required">*</span></label>
        <input class="form-input" id="addrProvince" type="text" placeholder="如：广东省" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="addrCity">城市<span class="required">*</span></label>
        <input class="form-input" id="addrCity" type="text" placeholder="如：深圳市" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="addrDistrict">区/县<span class="required">*</span></label>
        <input class="form-input" id="addrDistrict" type="text" placeholder="如：南山区" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="addrDetail">详细地址<span class="required">*</span></label>
        <input class="form-input" id="addrDetail" type="text" placeholder="如：科技园路88号创新大厦1201室" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="addrZip">邮政编码</label>
        <input class="form-input" id="addrZip" type="text" placeholder="选填">
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="addrDefault" style="accent-color:var(--primary)"> 设为默认地址
        </label>
      </div>
      <input type="hidden" id="addrEditId">
      <div class="btn-row">
        <button type="button" class="btn btn-outline" onclick="closeAddressModal()">取消</button>
        <button type="submit" class="btn btn-primary" id="addrSubmitBtn">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
(function() {
  'use strict';

  /* ================================================================
     Auth Guard
     ================================================================ */
  if (!AUTH.isLoggedIn()) {
    location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
    return;
  }

  /* ================================================================
     DOM Refs
     ================================================================ */
  var $addressList = document.getElementById('addressList');
  var $orderItems = document.getElementById('orderItems');
  var $sumSubtotal = document.getElementById('sumSubtotal');
  var $sumTotal = document.getElementById('sumTotal');
  var $btnSubmit = document.getElementById('btnSubmit');
  var $btnAddAddress = document.getElementById('btnAddAddress');

  /* ================================================================
     State
     ================================================================ */
  var addresses = [];
  var selectedAddressId = null;
  var checkedItems = [];
  var isSubmitting = false;

  /* ================================================================
     Init
     ================================================================ */
  renderNavbar('checkout');
  initMobileNav('checkout');

  // Get checked items
  checkedItems = CART.getCheckedItems();
  if (checkedItems.length === 0) {
    showToast('购物车中没有选中的商品', 'warning');
    setTimeout(function() { location.href = '/cart.html'; }, 1000);
    return;
  }

  loadAddresses();
  renderOrderItems();
  renderPriceSummary();

  /* ================================================================
     Address Loading
     ================================================================ */
  async function loadAddresses() {
    try {
      var res = await api.getAddresses();
      addresses = (res && res.data) ? res.data : [];
      // Ensure addresses is an array
      if (!Array.isArray(addresses)) {
        addresses = res.data.list || res.data.records || [];
      }
      renderAddresses();
      // Auto-select first address if none selected
      if (!selectedAddressId && addresses.length > 0) {
        selectAddress(addresses[0].id);
      }
    } catch (e) {
      addresses = [];
      renderAddresses();
      showToast('加载地址失败: ' + (e.message || '未知错误'), 'error');
    }
  }

  function renderAddresses() {
    if (!addresses || addresses.length === 0) {
      $addressList.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">📍</div>' +
          '<p>暂无收货地址，请添加</p>' +
        '</div>';
      return;
    }

    var html = '';
    addresses.forEach(function(addr) {
      var isSelected = (selectedAddressId === addr.id);
      var fullAddress = [addr.province, addr.city, addr.district, addr.detail]
        .filter(Boolean).join(' ');
      html +=
        '<div class="address-card' + (isSelected ? ' selected' : '') + '" data-id="' + addr.id + '" onclick="checkoutSelectAddress(' + addr.id + ')">' +
          '<div class="addr-header">' +
            '<span class="addr-name">' + escHtml(addr.name || addr.consignee || '') + '</span>' +
            (addr.isDefault || addr.defaulted ? '<span class="addr-tag">默认</span>' : '') +
            '<span class="addr-actions" style="margin-left:auto">' +
              '<button onclick="event.stopPropagation();checkoutEditAddress(' + addr.id + ')" title="编辑">✏️</button>' +
              '<button onclick="event.stopPropagation();checkoutDeleteAddress(' + addr.id + ')" title="删除">🗑️</button>' +
            '</span>' +
          '</div>' +
          '<div class="addr-detail">' + escHtml(fullAddress) + '</div>' +
          '<div class="addr-phone">' + escHtml(addr.phone || addr.mobile || '') + '</div>' +
        '</div>';
    });
    $addressList.innerHTML = html;
  }

  /* ================================================================
     Address Selection
     ================================================================ */
  window.checkoutSelectAddress = function(id) {
    selectedAddressId = id;
    renderAddresses();
  };

  /* ================================================================
     Address Edit
     ================================================================ */
  window.checkoutEditAddress = function(id) {
    var addr = addresses.find(function(a) { return a.id === id; });
    if (!addr) return;
    document.getElementById('addressModalTitle').textContent = '编辑收货地址';
    document.getElementById('addrEditId').value = addr.id;
    document.getElementById('addrName').value = addr.name || addr.consignee || '';
    document.getElementById('addrPhone').value = addr.phone || addr.mobile || '';
    document.getElementById('addrProvince').value = addr.province || '';
    document.getElementById('addrCity').value = addr.city || '';
    document.getElementById('addrDistrict').value = addr.district || '';
    document.getElementById('addrDetail').value = addr.detail || '';
    document.getElementById('addrZip').value = addr.zip || addr.zipCode || '';
    document.getElementById('addrDefault').checked = !!(addr.isDefault || addr.defaulted);
    openAddressModal();
  };

  /* ================================================================
     Address Delete
     ================================================================ */
  window.checkoutDeleteAddress = async function(id) {
    if (!confirm('确定要删除这个地址吗？')) return;
    try {
      await api.deleteAddress(id);
      if (selectedAddressId === id) selectedAddressId = null;
      showToast('地址已删除', 'success');
      await loadAddresses();
    } catch (e) {
      showToast('删除失败: ' + (e.message || '未知错误'), 'error');
    }
  };

  /* ================================================================
     Address Modal
     ================================================================ */
  function openAddressModal() {
    openModal('addressModal');
  }

  function closeAddressModal() {
    closeModal('addressModal');
    resetAddressForm();
  }

  function resetAddressForm() {
    document.getElementById('addressForm').reset();
    document.getElementById('addrEditId').value = '';
    document.getElementById('addressModalTitle').textContent = '新增收货地址';
  }

  // Close modal on overlay click
  document.getElementById('addressModal').addEventListener('click', function(e) {
    if (e.target === this) closeAddressModal();
  });

  $btnAddAddress.addEventListener('click', function() {
    resetAddressForm();
    openAddressModal();
  });

  document.getElementById('addressForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    var addrData = {
      name: document.getElementById('addrName').value.trim(),
      phone: document.getElementById('addrPhone').value.trim(),
      province: document.getElementById('addrProvince').value.trim(),
      city: document.getElementById('addrCity').value.trim(),
      district: document.getElementById('addrDistrict').value.trim(),
      detail: document.getElementById('addrDetail').value.trim(),
      zip: document.getElementById('addrZip').value.trim() || undefined,
      isDefault: document.getElementById('addrDefault').checked
    };

    // Validation
    if (!addrData.name) { showToast('请输入收货人姓名', 'warning'); return; }
    if (!addrData.phone) { showToast('请输入手机号码', 'warning'); return; }
    if (!/^1[3-9]\d{9}$/.test(addrData.phone)) { showToast('手机号格式不正确', 'warning'); return; }
    if (!addrData.province) { showToast('请输入省份', 'warning'); return; }
    if (!addrData.city) { showToast('请输入城市', 'warning'); return; }
    if (!addrData.district) { showToast('请输入区/县', 'warning'); return; }
    if (!addrData.detail) { showToast('请输入详细地址', 'warning'); return; }

    var editId = document.getElementById('addrEditId').value;
    var btn = document.getElementById('addrSubmitBtn');
    btn.disabled = true;
    btn.textContent = '保存中...';

    try {
      if (editId) {
        await api.updateAddress(parseInt(editId), addrData);
        showToast('地址已更新', 'success');
      } else {
        await api.addAddress(addrData);
        showToast('地址已添加', 'success');
      }
      closeAddressModal();
      await loadAddresses();
    } catch (err) {
      showToast('保存失败: ' + (err.message || '未知错误'), 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '保存';
    }
  });

  /* ================================================================
     Order Items Rendering
     ================================================================ */
  function renderOrderItems() {
    var html = '';
    checkedItems.forEach(function(item) {
      var imgHtml;
      if (item.image) {
        imgHtml = '<img src="' + escHtml(item.image) + '" alt="' + escHtml(item.name) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="img-placeholder" style="display:none">📦</div>';
      } else {
        imgHtml = '<div class="img-placeholder">📦</div>';
      }

      html +=
        '<div class="checkout-item">' +
          '<div class="ci-img">' + imgHtml + '</div>' +
          '<div class="ci-info">' +
            '<div class="ci-name">' + escHtml(item.name) + '</div>' +
            '<div class="ci-sku">' + escHtml(item.skuName || '默认规格') + '</div>' +
            '<div class="ci-price-qty">' +
              '<span class="ci-price">' + formatPrice(item.price) + '</span>' +
              '<span class="ci-qty">x' + item.quantity + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="ci-subtotal">' + formatPrice(item.price * item.quantity) + '</div>' +
        '</div>';
    });
    $orderItems.innerHTML = html;
  }

  /* ================================================================
     Price Summary
     ================================================================ */
  function renderPriceSummary() {
    var subtotal = checkedItems.reduce(function(sum, item) {
      return sum + item.price * item.quantity;
    }, 0);
    $sumSubtotal.textContent = formatPrice(subtotal);
    $sumTotal.textContent = formatPrice(subtotal);
    loadCoupons(subtotal);
  }

  var selectedCouponId = null;
  var couponDiscount = 0;

  async function loadCoupons(subtotal) {
    if (!AUTH.isLoggedIn()) return;
    try {
      var r = await api.getAvailableCoupons(subtotal);
      var coupons = r.data || [];
      var sel = document.getElementById('couponSelect');
      sel.innerHTML = '<option value="">不使用优惠券</option>';
      coupons.forEach(function(c) {
        var label = c.name + ' (';
        if (c.discount_type === 'PERCENTAGE') label += c.discount_value + '%折扣';
        else label += '满' + c.min_spend + '减' + c.discount_value;
        label += ')';
        sel.innerHTML += '<option value="' + c.id + '" data-discount="' + c.discount_value + '" data-type="' + c.discount_type + '">' + label + '</option>';
      });
      if (coupons.length === 0) {
        document.getElementById('couponHint').textContent = '（暂无可用优惠券）';
      }
    } catch(e) {}
  }

  window.onCouponChange = function() {
    var sel = document.getElementById('couponSelect');
    var opt = sel.options[sel.selectedIndex];
    var discountRow = document.getElementById('couponDiscountRow');
    if (!opt.value) {
      selectedCouponId = null;
      couponDiscount = 0;
      discountRow.style.display = 'none';
    } else {
      selectedCouponId = parseInt(opt.value);
      var dval = parseFloat(opt.getAttribute('data-discount'));
      var dtype = opt.getAttribute('data-type');
      var subtotal = checkedItems.reduce(function(sum, item) { return sum + item.price * item.quantity; }, 0);
      if (dtype === 'PERCENTAGE') couponDiscount = Math.round(subtotal * dval / 100 * 100) / 100;
      else couponDiscount = dval;
      document.getElementById('couponDiscount').textContent = '-¥' + couponDiscount.toFixed(2);
      discountRow.style.display = '';
    }
    var subtotal = checkedItems.reduce(function(sum, item) { return sum + item.price * item.quantity; }, 0);
    document.getElementById('sumTotal').textContent = formatPrice(Math.max(0, subtotal - couponDiscount));
  }

  /* ================================================================
     Submit Order
     ================================================================ */
  $btnSubmit.addEventListener('click', async function() {
    if (isSubmitting) return;

    // Validate address
    if (!selectedAddressId) {
      showToast('请选择收货地址', 'warning');
      document.getElementById('sectionAddress').scrollIntoView({ behavior: 'smooth' });
      return;
    }

    // Refresh checked items from cart in case cart changed
    checkedItems = CART.getCheckedItems();
    if (checkedItems.length === 0) {
      showToast('购物车中没有选中的商品', 'warning');
      setTimeout(function() { location.href = '/cart.html'; }, 1000);
      return;
    }

    isSubmitting = true;
    $btnSubmit.disabled = true;
    $btnSubmit.classList.add('btn-loading');
    $btnSubmit.textContent = '正在提交订单';

    // Use coupon if selected
    if (selectedCouponId) {
      try { await api.useCoupon(selectedCouponId); } catch(e) {}
    }

    var orderIds = [];
    var hasError = false;

    try {
      for (var i = 0; i < checkedItems.length; i++) {
        var item = checkedItems[i];
        var orderData = {
          productId: item.productId,
          skuId: item.skuId || null,
          quantity: item.quantity,
          addressId: selectedAddressId
        };

        var res = await api.createOrder(orderData);
        if (res && res.data) {
          // Extract order id from response
          var orderId = res.data.id || res.data.orderId || res.data;
          if (typeof orderId === 'object') {
            orderId = orderId.id || orderId.orderId;
          }
          if (orderId) {
            orderIds.push(orderId);
          }
        }
      }

      // Remove checked items from cart
      CART.removeChecked();

      showToast('订单提交成功！', 'success');

      // Redirect to payment page(s)
      // Use the first order ID; if multiple orders, concatenate
      var redirectOrderId = orderIds.length > 0 ? orderIds.join(',') : '';
      setTimeout(function() {
        if (redirectOrderId) {
          location.href = '/payment.html?orderId=' + encodeURIComponent(redirectOrderId);
        } else {
          location.href = '/user.html';
        }
      }, 1000);

    } catch (err) {
      hasError = true;
      showToast('订单提交失败: ' + (err.message || '请稍后重试'), 'error');
      isSubmitting = false;
      $btnSubmit.disabled = false;
      $btnSubmit.classList.remove('btn-loading');
      $btnSubmit.textContent = '提交订单';
    }
  });

  /* ================================================================
     HTML Escape Helper
     ================================================================ */
  function escHtml(str) {
    if (!str && str !== 0) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str)));
    return div.innerHTML;
  }

})();
</script>
</body>
</html>
