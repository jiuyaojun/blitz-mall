<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌好店 - Blitz 智能商城</title>
<link rel="stylesheet" href="/css/common.css">
<style>
/* ============================================================
   Shops Directory Page — Shop cards grid
   ============================================================ */

/* Page hero */
.shops-hero {
  text-align: center;
  padding: var(--space-2xl) var(--space-lg) var(--space-xl);
}
.shops-hero .hero-title {
  font-size: var(--fs-display);
  font-weight: 800;
  color: var(--text);
  margin-bottom: var(--space-sm);
}
.shops-hero .hero-sub {
  font-size: var(--fs-body);
  color: var(--text-muted);
  max-width: 480px;
  margin: 0 auto;
  line-height: 1.6;
}

/* Grid */
.shops-grid {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--space-lg) var(--space-2xl);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-lg);
}

/* Shop card */
.shop-dir-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: var(--space-lg);
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}
.shop-dir-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}

/* Header: avatar + info */
.sd-header {
  display: flex;
  gap: var(--space-md);
  align-items: flex-start;
}
.sd-avatar {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-lg);
  background: var(--primary-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  flex-shrink: 0;
  overflow: hidden;
}
.sd-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.sd-info {
  flex: 1;
  min-width: 0;
}
.sd-name {
  font-size: var(--fs-subtitle);
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 4px;
}
.sd-desc {
  font-size: var(--fs-caption);
  color: var(--text-muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: var(--space-sm);
}
.sd-stats {
  font-size: var(--fs-small);
  color: var(--text-secondary);
}

/* Product thumbnails */
.sd-products {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
}
.sd-products .sd-thumb {
  aspect-ratio: 1;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #FAFAFA;
}
.sd-products .sd-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.sd-products .sd-thumb .sd-thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  color: var(--text-muted);
}

/* Enter button */
.sd-enter {
  align-self: flex-start;
}

/* Loading / error / empty */
.shops-status {
  text-align: center;
  padding: var(--space-2xl) var(--space-lg);
}

@media (max-width: 768px) {
  .shops-hero {
    padding: var(--space-xl) var(--space-md) var(--space-lg);
  }
  .shops-hero .hero-title {
    font-size: var(--fs-title);
  }
  .shops-hero .hero-sub {
    font-size: var(--fs-caption);
  }
  .shops-grid {
    grid-template-columns: 1fr;
    padding: 0 var(--space-md) var(--space-xl);
    gap: var(--space-md);
  }
  .shop-dir-card {
    padding: var(--space-md);
  }
  .sd-avatar {
    width: 56px;
    height: 56px;
    font-size: 1.5rem;
    border-radius: var(--radius-md);
  }
  .sd-name {
    font-size: var(--fs-body);
  }
  .sd-products {
    gap: 6px;
  }
}
</style>
</head>
<body>

<nav id="blitz-navbar" class="blitz-navbar"></nav>

<!-- Hero -->
<div class="shops-hero">
  <h1 class="hero-title">🏪 品牌好店</h1>
  <p class="hero-sub">发现品质店铺，遇见心动好物</p>
</div>

<!-- Shops grid -->
<div class="shops-grid" id="shopsGrid"></div>

<!-- Loading -->
<div id="loadingArea" class="shops-status"><div class="spinner"></div></div>

<!-- Empty state -->
<div id="emptyState" class="empty-state hidden">
  <div class="empty-icon">🏪</div>
  <h3>暂无店铺</h3>
  <p>还没有店铺入驻，敬请期待</p>
  <a href="/" class="btn btn-outline mt-16">返回首页</a>
</div>

<!-- Error state -->
<div id="errorState" class="empty-state hidden">
  <div class="empty-icon">😞</div>
  <h3 id="errorTitle">加载失败</h3>
  <p id="errorDesc">请检查网络连接后重试</p>
  <button id="retryBtn" class="btn btn-primary mt-16">重新加载</button>
</div>

<footer class="blitz-footer">
  <div class="footer-inner">
    <div class="footer-col">
      <h4>购物指南</h4>
      <a href="/products.html">全部商品</a>
      <a href="/seckill.html">秒杀专区</a>
      <a href="/products.html?sort=newest">新品首发</a>
    </div>
    <div class="footer-col">
      <h4>客户服务</h4>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">帮助中心</a>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">退货政策</a>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">配送说明</a>
    </div>
    <div class="footer-col">
      <h4>关于我们</h4>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">关于 Blitz</a>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">隐私政策</a>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">用户协议</a>
    </div>
    <div class="footer-col">
      <h4>关注我们</h4>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">微信公众号</a>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">新浪微博</a>
      <a href="javascript:void(0)" onclick="showToast('页面建设中','info')">联系邮箱</a>
    </div>
  </div>
  <div class="footer-bottom">&copy; 2026 Blitz 智能商城. All rights reserved.</div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script>
/* ================================================================
   Shops Directory Page Script
   ================================================================ */
(function() {
  'use strict';

  /* ---- Init ---- */
  renderNavbar('shops');
  initMobileNav('shops');
  document.title = '品牌好店 - Blitz 智能商城';

  loadShops();

  /* ---- Retry ---- */
  document.getElementById('retryBtn').addEventListener('click', function() {
    loadShops();
  });

  /* ---- Load all products and group by shopId ---- */
  function loadShops() {
    showLoading(true);
    hideError();
    hideEmpty();
    document.getElementById('shopsGrid').innerHTML = '';

    api.getProducts({ size: 200 }).then(function(r) {
      showLoading(false);

      var products = (r.data && r.data.records) ? r.data.records
        : (Array.isArray(r.data) ? r.data : []);

      if (!products || products.length === 0) {
        showEmpty();
        return;
      }

      // Group products by shopId
      var shopMap = {};
      products.forEach(function(p) {
        var sid = p.shopId != null ? p.shopId : 0;
        if (!shopMap[sid]) {
          shopMap[sid] = {
            shopId: sid,
            shopName: p.shopName || ('店铺 #' + sid),
            products: [],
            totalSales: 0
          };
        }
        shopMap[sid].products.push(p);
        shopMap[sid].totalSales += (p.saleCount || 0);
      });

      var shops = Object.values(shopMap);

      if (shops.length === 0) {
        showEmpty();
        return;
      }

      renderShops(shops);
    }).catch(function(err) {
      showLoading(false);
      showError('加载店铺列表失败', (err && err.message) || '请检查网络连接后重试');
    });
  }

  /* ---- Render shop cards ---- */
  function renderShops(shops) {
    var grid = document.getElementById('shopsGrid');
    var html = '';

    shops.forEach(function(shop) {
      var name = shop.shopName;
      var productCount = shop.products.length;
      var totalSales = shop.totalSales;

      // Generate a short description from shop name
      var desc = generateShopDesc(name);

      // Avatar: use first letter of shop name
      var avatarLetter = (name || '店').charAt(0);
      var avatarHtml = '<div class="sd-avatar">' + escapeHtml(avatarLetter) + '</div>';

      // Top 4 product thumbnails
      var topProducts = shop.products.slice(0, 4);
      var thumbsHtml = '';
      topProducts.forEach(function(p) {
        var imgSrc = p.mainImage || p.image || '';
        if (imgSrc) {
          thumbsHtml += '<div class="sd-thumb"><img src="' + escapeHtml(imgSrc) + '" alt="' + escapeHtml(p.name) + '" loading="lazy"></div>';
        } else {
          thumbsHtml += '<div class="sd-thumb"><div class="sd-thumb-placeholder">📦</div></div>';
        }
      });
      // Pad to 4 if fewer products
      while (topProducts.length < 4) {
        thumbsHtml += '<div class="sd-thumb"><div class="sd-thumb-placeholder">📦</div></div>';
        topProducts.push(null);
      }

      html +=
        '<div class="shop-dir-card">' +
          '<div class="sd-header">' +
            avatarHtml +
            '<div class="sd-info">' +
              '<div class="sd-name">' + escapeHtml(name) + '</div>' +
              '<div class="sd-desc">' + escapeHtml(desc) + '</div>' +
              '<div class="sd-stats">' + formatNumber(productCount) + '件商品 &middot; ' + formatNumber(totalSales) + '销量</div>' +
            '</div>' +
          '</div>' +
          '<div class="sd-products">' + thumbsHtml + '</div>' +
          '<a href="/shop.html?id=' + shop.shopId + '" class="btn btn-outline btn-sm sd-enter">进店逛逛 &rarr;</a>' +
        '</div>';
    });

    grid.innerHTML = html;
  }

  /* ---- Generate a shop description from the name ---- */
  function generateShopDesc(name) {
    var descs = {
      '旗舰店': '官方旗舰店，品质保证，正品直销',
      '专卖店': '品牌专卖，专注好物，服务贴心',
      '专营店': '品类专营，精选好货，值得信赖',
      '自营': '平台自营，严选品质，极速配送',
      '官方': '官方授权，正品保障，售后无忧'
    };
    for (var key in descs) {
      if (name.indexOf(key) !== -1) return descs[key];
    }
    return '用心挑选每一件好物，为您带来优质的购物体验';
  }

  /* ---- Show / hide states ---- */
  function showLoading(on) {
    document.getElementById('loadingArea').style.display = on ? 'block' : 'none';
  }

  function showEmpty() {
    document.getElementById('emptyState').classList.remove('hidden');
  }

  function hideEmpty() {
    document.getElementById('emptyState').classList.add('hidden');
  }

  function showError(title, desc) {
    document.getElementById('errorTitle').textContent = title || '加载失败';
    document.getElementById('errorDesc').textContent = desc || '请检查网络连接后重试';
    document.getElementById('errorState').classList.remove('hidden');
  }

  function hideError() {
    document.getElementById('errorState').classList.add('hidden');
  }

  /* ---- Helpers ---- */
  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
